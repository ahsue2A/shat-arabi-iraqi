<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شات عربي عراقي</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="logo">ع</div><div><h1>شات عربي عراقي</h1><p>لمة أهل العراق بكل مكان</p></div><span class="live">● مباشر</span></header>
<section id="auth" class="panel"><h2>أهلاً بيك 🌙</h2><p>ادخل بحسابك أو سجل حساب جديد.</p><input id="nick" maxlength="24" placeholder="اسمك الظاهر"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><div class="buttons"><button id="login">تسجيل الدخول</button><button id="register" class="alt">إنشاء حساب</button></div><button id="guest" class="guest">الدخول كزائر</button><p id="authMsg" class="status"></p></section>
<section id="chat" class="panel hidden"><div class="room"><div><h2 id="roomTitle">الغرفة العامة</h2><p id="roomSubtitle">احچي باحترام وخلي اللمة حلوة</p></div><span id="who"></span><button id="logout" class="alt">خروج</button></div>
<div class="workspace"><aside class="side"><h3>الغرف</h3><div id="roomList"></div><div class="roomTools"><input id="newRoomName" maxlength="30" placeholder="اسم غرفة خاصة"><button id="createRoom">إنشاء غرفة</button><input id="inviteCode" maxlength="6" placeholder="رمز الدعوة"><button id="joinRoom" class="alt">انضمام برمز</button><p id="roomMsg" class="status"></p></div><h3>المتصلون <span id="onlineCount">0</span></h3><div id="onlineList"></div></aside>
<div class="chatPane"><div id="messages"></div><form id="send"><input id="message" maxlength="1000" placeholder="اكتب رسالتك..." required><button>إرسال</button></form><p id="chatMsg" class="status"></p></div></div></section><footer>احترم الجميع ولا تشارك معلوماتك الخاصة.</footer></main><script type="module" src="app.js"></script></body></html>
