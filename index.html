<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شات عربي عراقي</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="logo">ع</div><div><h1>شات عربي عراقي</h1><p>لمة أهل العراق بكل مكان</p></div><span class="live">● مباشر</span></header><section id="auth" class="panel"><h2>أهلاً بيك 🌙</h2><p>ادخل بحسابك أو سجل حساب جديد.</p><input id="nick" maxlength="24" placeholder="اسمك الظاهر"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><div class="buttons"><button id="login">تسجيل الدخول</button><button id="register" class="alt">إنشاء حساب</button></div><button id="guest" class="guest">الدخول كزائر</button><p id="authMsg" class="status"></p></section><section id="chat" class="panel hidden"><div class="room"><div><h2>الغرفة العامة</h2><p>احچي باحترام وخلي اللمة حلوة</p></div><span id="who"></span><button id="logout" class="alt">خروج</button></div><div id="messages"></div><form id="send"><input id="message" maxlength="1000" placeholder="اكتب رسالتك..." required><button>إرسال</button></form><p id="chatMsg" class="status"></p></section><footer>احترم الجميع ولا تشارك معلوماتك الخاصة.</footer></main><script type="module" src="app.js"></script></body></html>
