<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شات عربي عراقي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">

<header>
  <div class="logo">ع</div>
  <div>
    <h1>شات عربي عراقي</h1>
    <p>لمة أهل العراق بكل مكان</p>
  </div>
  <span class="live">● مباشر</span>
</header>

<section id="auth" class="panel">
  <h2>أهلاً بيك 🌙</h2>
  <p>ادخل بحسابك أو سجل حساب جديد.</p>
  <input id="nick" maxlength="24" placeholder="اسمك الظاهر">
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)">
  <div class="buttons">
    <button id="login">تسجيل الدخول</button>
    <button id="register" class="alt">إنشاء حساب</button>
  </div>
  <button id="guest" class="guest">الدخول كزائر</button>
  <p id="authMsg" class="status"></p>
</section>

<section id="chat" class="panel hidden">
  <div class="room">
    <div>
      <h2 id="roomTitle">الغرفة العامة</h2>
      <p id="roomSubtitle">احچي باحترام وخلي اللمة حلوة</p>
    </div>
    <span id="who"></span>
    <button id="logout" class="alt">خروج</button>
  </div>

  <div class="workspace">
    <aside class="side">
      <h3>الغرف</h3>
      <div id="roomList"></div>

      <div class="roomTools">
        <input id="newRoomName" maxlength="30" placeholder="اسم غرفة خاصة">
        <button id="createRoom">إنشاء غرفة</button>
        <input id="inviteCode" maxlength="32" placeholder="رمز الدعوة">
        <button id="joinRoom" class="alt">انضمام برمز</button>
        <p id="roomMsg" class="status"></p>
      </div>

      <h3>المتصلون <span id="onlineCount">0</span></h3>
      <div id="onlineList"></div>
    </aside>

    <div class="chatPane">
      <div id="messages"></div>
      <form id="send">
        <input id="message" maxlength="1000" placeholder="اكتب رسالتك..." required>
        <button>إرسال</button>
      </form>
      <p id="chatMsg" class="status"></p>
    </div>
  </div>
</section>

<!-- نافذة الملف الشخصي -->
<div id="profileModal" class="profileModal hidden">
  <div class="profileCard">
    <button id="closeProfile" class="closeProfile">✕</button>

    <div class="profileCover">
      <img id="viewCover" alt="صورة الغلاف">
    </div>

    <div class="profileInfo">
      <img id="viewAvatar" class="profileAvatar" alt="الصورة الشخصية">
      <h2 id="viewName">اسم العضو</h2>
      <div id="viewRole" class="profileRole"></div>
      <p id="viewStatus">لا توجد حالة حالياً</p>
    </div>

    <!-- لوحة الإدارة -->
    <div id="moderationPanel" class="moderationPanel hidden">
      <h3>🛡️ إدارة العضو</h3>

      <label for="moderationAction">نوع الإجراء</label>
      <select id="moderationAction">
        <option value="mute">كتم في العامة</option>
        <option value="generalBlock">منع من العامة</option>
        <option value="roomKick">طرد من الغرفة الخاصة</option>
        <option value="fullBan">حظر كامل مؤقت</option>
        <option value="permanentBan">حظر كامل دائم</option>
        <option value="unmute">رفع الكتم</option>
        <option value="unblockGeneral">رفع منع العامة</option>
        <option value="unban">رفع الحظر الكامل</option>
      </select>

      <label for="moderationDuration">المدة</label>
      <select id="moderationDuration">
        <option value="10">10 دقائق</option>
        <option value="60">ساعة واحدة</option>
        <option value="4320">3 أيام</option>
        <option value="10080">أسبوع واحد</option>
      </select>

      <label for="moderationReason">سبب الإجراء (اختياري)</label>
      <input id="moderationReason" maxlength="200"
             placeholder="اكتب سبب الإجراء">

      <button id="applyModeration">تنفيذ الإجراء</button>
      <p id="moderationMsg" class="status"></p>
    </div>

    <!-- تعديل الملف الشخصي -->
    <div id="editProfile" class="editProfile hidden">
      <h3>تعديل ملفي الشخصي</h3>

      <label>رابط الصورة الشخصية</label>
      <input id="avatarURL" type="url" placeholder="https://example.com/photo.jpg">

      <label>رابط صورة الغلاف</label>
      <input id="coverURL" type="url" placeholder="https://example.com/cover.jpg">

      <label>حالتي الشخصية</label>
      <input id="customStatus" maxlength="100" placeholder="اكتب شيئاً عن نفسك...">

      <button id="saveProfile">حفظ التغييرات</button>
      <p id="profileMsg" class="status"></p>
    </div>
  </div>
</div>

<footer>احترم الجميع ولا تشارك معلوماتك الخاصة.</footer>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
